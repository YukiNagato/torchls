[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchls"
version = "0.1.0"
description = "Batched block-sparse nonlinear least squares in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3"]

[project.optional-dependencies]
warp = ["warp-lang>=1.17"]
test = ["pytest>=8", "numpy", "scipy"]
reference = ["jax>=0.6", "jaxlie>=1.0", "jax_dataclasses>=1.6.2", "loguru", "termcolor", "rich", "tqdm"]
lint = ["ruff>=0.9"]
benchmark = ["numpy", "scipy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["torchls", "torchls.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF022"]
